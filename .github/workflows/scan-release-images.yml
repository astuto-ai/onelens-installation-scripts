name: Scan Released Images

# Daily check that every image the latest release can deploy still passes customers'
# image gates (Trivy 0.57.1, HIGH/CRITICAL, unfixed included). New CVEs are published
# against images that were clean when released; a finding here means a rebuild or
# version bump is due before a customer's gate finds it. Customer gates pull a fresh
# vulnerability DB every day, so a weekly check could trail them by six days.
#
# Findings exit 2 and Trivy errors exit 1, so a registry or DB error (public.ecr.aws
# rate-limits anonymous pulls) is retried and, if it persists, reported as "could not
# scan" rather than as a finding.
#
# A failure posts to Microsoft Teams through the webhook URL in the TEAMS_WEBHOOK_URL
# secret (a Teams Workflows "Post to a channel when a webhook request is received" flow).
# Run it by hand with test_alert to check that the alert reaches the channel.
#
# Not covered: dcgm-exporter (GPU clusters only) and kube-rbac-proxy (off by default).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Post a test alert to Teams even if every image passes
        type: boolean
        default: false

permissions:
  contents: read

env:
  CHART_REPO: "https://astuto-ai.github.io/onelens-installation-scripts"

jobs:
  list-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
      release: ${{ steps.list.outputs.release }}
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: List every image the latest release can deploy
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          VERSION=${TAG#v}
          echo "Latest release: $TAG"
          echo "release=$TAG" >> "$GITHUB_OUTPUT"
          helm repo add onelens "$CHART_REPO" >/dev/null
          curl -fsSL "$CHART_REPO/globalvalues-v$VERSION.yaml" -o values.yaml
          # Prometheus backend, VictoriaMetrics backend, and the opt-in exporters.
          {
            for flags in "" \
                "--set prometheus.server.replicaCount=0 --set prometheus.configmapReload.prometheus.enabled=false --set onelens-agent.metricsBackend=victoriametrics" \
                "--set prometheus.prometheus-node-exporter.enabled=true --set onelens-agent.networkCosts.enabled=true"; do
              # shellcheck disable=SC2086
              helm template scan onelens/onelens-agent --version "$VERSION" -f values.yaml $flags
            done | sed -nE 's/^[[:space:]]+image:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p'
            echo "public.ecr.aws/w7k6q5m9/onelens-deployer:$TAG"
          } | sort -u > images.txt
          cat images.txt
          echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0))' images.txt)" >> "$GITHUB_OUTPUT"

  scan:
    needs: list-images
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # All images at once hit public.ecr.aws's anonymous pull rate limit.
      max-parallel: 4
      matrix:
        image: ${{ fromJson(needs.list-images.outputs.images) }}
    steps:
      # The notify job reads the annotation titles to tell findings from scan errors.
      - name: Scan amd64 and arm64
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          failed=0
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$IMAGE ($platform)"
            for attempt in 1 2 3; do
              rc=0
              # A hung pull or scan is stopped (exit 124, or 137 if the docker client
              # ignores SIGTERM) and retried like any other error.
              timeout -k 30s 10m docker run --rm aquasec/trivy:0.57.1 image --image-src remote --platform "$platform" \
                --scanners vuln --severity HIGH,CRITICAL --exit-code 2 "$IMAGE" || rc=$?
              case "$rc" in 0|2) break ;; esac
              [ "$attempt" -lt 3 ] || break
              echo "Trivy failed (exit $rc); retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
            echo "::endgroup::"
            if [ "$rc" -eq 2 ]; then
              echo "::error title=HIGH/CRITICAL findings::$IMAGE ($platform)"
              failed=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error title=Could not scan::$IMAGE ($platform): Trivy failed 3 times (exit $rc); see the log above"
              failed=1
            fi
          done
          exit $failed

  notify:
    needs: [list-images, scan]
    if: >-
      always() && (needs.list-images.result == 'failure' || needs.scan.result == 'failure'
      || inputs.test_alert == true)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Post to Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          LIST_RESULT: ${{ needs.list-images.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RELEASE: ${{ needs.list-images.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "::error::TEAMS_WEBHOOK_URL is not set, so nobody was alerted. Add the Teams Workflows webhook URL as a repository secret."
            exit 1
          fi

          # Scan jobs are named after their image, so the failed jobs are the failed images.
          # A job counts as "could not scan" only if its annotations say so and report no
          # findings; anything else, including a failed lookup, counts as findings.
          # The alert still goes out if the job lookup fails; it just lists no images.
          findings=""
          errors=""
          if [ "$SCAN_RESULT" = "failure" ]; then
            jobs=$(gh api --paginate \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
              -q '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"') || jobs=""
            while IFS=$'\t' read -r id name; do
              [ -n "$id" ] || continue
              titles=$(gh api "repos/${{ github.repository }}/check-runs/$id/annotations" -q '.[].title') || titles=""
              if grep -qx 'Could not scan' <<<"$titles" && ! grep -qx 'HIGH/CRITICAL findings' <<<"$titles"; then
                errors+="$name"$'\n'
              else
                findings+="$name"$'\n'
              fi
            done <<<"$jobs"
          fi
          nfind=$(printf '%s' "$findings" | grep -c . || true)
          nerr=$(printf '%s' "$errors" | grep -c . || true)

          errors_header=""
          if [ "$LIST_RESULT" = "failure" ]; then
            title="OneLens security check could not run"
            text="Listing the images of the latest OneLens release failed, so nothing was scanned today."
          elif [ "$SCAN_RESULT" = "failure" ] && [ "$nfind" -eq 0 ] && [ "$nerr" -gt 0 ]; then
            title="OneLens $RELEASE security check could not scan $nerr image(s)"
            text="Trivy failed 3 times on each of these (registry or vulnerability DB errors), so they were not checked today. This is not a finding. If it repeats, check that the image still exists."
          elif [ "$SCAN_RESULT" = "failure" ]; then
            title="OneLens $RELEASE security check failed"
            if [ "$nfind" -gt 0 ]; then
              text="$nfind image(s) in the latest release now have HIGH or CRITICAL findings under Trivy 0.57.1."
            else
              text="Images in the latest release now have HIGH or CRITICAL findings under Trivy 0.57.1."
            fi
            text="$text Rebuild or bump them."
            [ "$nerr" -eq 0 ] || errors_header="Also could not be scanned today (not a finding):"
          else
            title="Test alert: OneLens security check"
            text="A manual run with test_alert posted this. Security check alerts reach this channel."
          fi

          jq -n --arg title "$title" --arg text "$text" --arg findings "$findings" --arg errors "$errors" \
            --arg errors_header "$errors_header" --arg url "$RUN_URL" '
            def mono: split("\n") | map(select(length > 0))
              | map({type: "TextBlock", text: ., fontType: "Monospace", spacing: "None", wrap: true});
            {
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: ([
                    {type: "TextBlock", text: $title, weight: "Bolder", size: "Medium", wrap: true},
                    {type: "TextBlock", text: $text, wrap: true}
                  ] + ($findings | mono)
                    + (if $errors_header == "" then [] else [{type: "TextBlock", text: $errors_header, wrap: true}] end)
                    + ($errors | mono)),
                  actions: [{type: "Action.OpenUrl", title: "Open the run", url: $url}]
                }
              }]
            }' > card.json
          curl -fsS -X POST -H "Content-Type: application/json" --data @card.json "$TEAMS_WEBHOOK_URL"
