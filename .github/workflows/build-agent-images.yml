name: Build Agent Stack Images

# Third-party images in the agent stack, rebuilt from their upstream release tags with
# patched Go modules (images/go-mod-bump.sh) so they pass customers' HIGH/CRITICAL
# image scans. images/<name>/TAG is the published tag. It matches the upstream tag, so
# customers who mirror images through a pull-through cache of the upstream registry
# still find it. Published tags are never overwritten: to rebuild the same upstream
# version, add or raise an -olN suffix (v3.13.5-ol1), then point globalvalues.yaml at it.

on:
  push:
    branches:
      - master
    paths:
      - 'images/**'
      - '.github/workflows/build-agent-images.yml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/build-agent-images.yml'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: "public.ecr.aws/w7k6q5m9"
  AWS_ECR_ROLE_ARN: "arn:aws:iam::609916866699:role/onelens-agent-github-actions-ecr-role"
  AWS_ECR_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [prometheus, pushgateway, kube-state-metrics, opencost, node-exporter]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read image tag
        id: tag
        run: |
          TAG=$(tr -d '[:space:]' < images/${{ matrix.image }}/TAG)
          VERSION=${TAG#v}
          VERSION=${VERSION%-ol*}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository=onelens-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "Building onelens-${{ matrix.image }}:$TAG from upstream $VERSION"

      # Customers gate images on Trivy 0.57.1 (HIGH/CRITICAL, unfixed included), so scan
      # each architecture the same way before anything is pushed.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v5
        with:
          context: images
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:amd64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REFRESH=${{ github.run_id }}

      - name: Scan amd64 image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 scan/${{ matrix.image }}:amd64

      - name: Build arm64 image for scanning
        uses: docker/build-push-action@v5
        with:
          context: images
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          load: true
          tags: scan/${{ matrix.image }}:arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REFRESH=${{ github.run_id }}

      - name: Scan arm64 image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 scan/${{ matrix.image }}:arm64

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_ECR_REGION }}
          role-session-name: GitHubActionsSession

      - name: Login to Amazon ECR Public
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Check whether the tag is already published
        id: published
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ steps.tag.outputs.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! aws ecr-public describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1; then
            echo "Creating repository $REPOSITORY"
            aws ecr-public create-repository --repository-name "$REPOSITORY" >/dev/null
          fi
          if aws ecr-public describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REPOSITORY:$TAG is already published and is not overwritten. Change images/${{ matrix.image }}/TAG to publish a rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: images
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ steps.tag.outputs.repository }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            REFRESH=${{ github.run_id }}
