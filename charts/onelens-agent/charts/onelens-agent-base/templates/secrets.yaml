apiVersion: v1
kind: Secret
metadata:
  name: {{ include "onelens-agent.fullname" . }}-secrets
type: Opaque
data:
  API_BASE_URL: {{ .Values.secrets.API_BASE_URL | b64enc }}
  CLUSTER_TOKEN: {{ .Values.secrets.CLUSTER_TOKEN | b64enc }}
  REGISTRATION_ID: {{ .Values.secrets.REGISTRATION_ID | b64enc }}
  # Durable store for the OpenCost GCP pricing API key (GKE). Lets the deployer recover it
  # even when `helm get values` fails, so it is never dropped across patching upgrades.
  GCP_API_KEY: {{ .Values.secrets.GCP_API_KEY | default "" | b64enc }} 